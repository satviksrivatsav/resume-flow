# AI Microservice
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: resume-flow-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-flow-ai
  template:
    metadata:
      labels:
        app: resume-flow-ai
    spec:
      containers:
      - name: resume-flow-ai
        image: resume-flow-ai:latest
        ports:
        - containerPort: 8001
        env:
        - name: LOGFIRE_TOKEN
          value: "${LOGFIRE_TOKEN}"
        - name: GROQ_API_KEY
          value: "${GROQ_API_KEY}"

---
apiVersion: v1
kind: Service
metadata:
  name: resume-flow-ai-service
spec:
  selector:
    app: resume-flow-ai
  ports:
  - port: 8001
    targetPort: 8001
  type: LoadBalancer

---

# Frontend
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: resume-flow-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-flow-ui
  template:
    metadata:
      labels:
        app: resume-flow-ui
    spec:
      containers:
      - name: resume-flow-ui
        image: resume-flow-ui:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: resume-flow-ui-service
spec:
  selector:
    app: resume-flow-ui
  ports:
  - port: 8002
    targetPort: 80
  type: LoadBalancer